name: Luxmap crawler
run-name: ${{ inputs.mode || 'full' }} Luxmap crawler
on:
  schedule:
    # Monday 09:00 Asia/Seoul (UTC 00:00). Reuse the full registry, not smoke.
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: Run scope
        required: true
        default: smoke
        type: choice
        options: [smoke, reference-smoke, full, image-check, parser-check]
      brand:
        description: Optional diagnostic scope (daily schedule always includes all brands)
        required: true
        default: all
        type: choice
        options: [all, bottega-veneta, van-cleef-arpels, louis-vuitton, dior]
permissions:
  contents: read
concurrency:
  group: luxmap-crawler
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: macos-14
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '25.8.0'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund > /dev/null 2>&1
      - name: Install required command line tools
        run: brew install ripgrep jq python@3.11 > /dev/null 2>&1
      - name: Provision pinned offline image processor
        if: inputs.mode != 'parser-check'
        run: |
          LUXURY_SETUP_PYTHON="$(brew --prefix python@3.11)/bin/python3.11" scripts/setup-image-runtime.sh > /dev/null 2>&1
          node scripts/build-dior-person-check.mjs
          node scripts/test-image-pipeline.mjs
      - name: Check platform and token safeguards
        run: |
          scripts/token-safety-gate.sh > /dev/null
          node scripts/test-catalog-completeness.mjs
          node scripts/test-catalog-product-contract.mjs
          node scripts/test-registered-maintenance.mjs
          node scripts/test-catalog-progress.mjs
          node scripts/test-guarded-summary-pages.mjs
          node scripts/test-weekly-phase-result.mjs
          node scripts/test-catalog-target-batches.mjs
          node scripts/test-prada-sitemap.mjs
          node scripts/test-crawler-schedule.mjs
          node scripts/test-catalog-availability.mjs
          node scripts/test-dior-official-core.mjs
          node scripts/test-dior-detail-attributes.mjs
          node scripts/test-dior-native-evidence.mjs
          node scripts/test-dior-page-data.mjs
          node scripts/test-dior-page-data-routing.mjs
          node scripts/test-dior-foreign-page-data.mjs
          node scripts/test-dior-market-store.mjs
          node scripts/test-dior-weekly.mjs
          node scripts/test-dior-own-image.mjs
          node scripts/test-dior-run-selection.mjs
          node scripts/test-dior-weekly-discovery.mjs
          node scripts/test-louis-vuitton-product.mjs
          node scripts/test-louis-vuitton-ready.mjs
          node scripts/test-louis-vuitton-serialized-data.mjs
          node scripts/test-louis-vuitton-sources.mjs
          node scripts/test-louis-vuitton-dispatch.mjs
          node scripts/test-catalog-stored-batch.mjs
          node scripts/test-official-reference-validation.mjs
          node scripts/test-official-reference-pipeline.mjs
          test -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network-outbound)' /usr/bin/true
          mkdir -p app crawler/service
      - name: Restore Dior denial receipts only
        if: inputs.mode != 'parser-check' && inputs.mode != 'image-check'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: crawler/runtime/dior-weekly/failures
          key: ${{ runner.os }}-dior-denials-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-dior-denials-
      - name: Collect and ingest through unified registry
        if: inputs.mode != 'image-check' && inputs.mode != 'parser-check'
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://nxgnbrdxxmlhtcnymqsl.supabase.co
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LUXURY_BROWSER_MAINTENANCE_SINK: '1'
          LUXURY_SERVICE_GUARD: enabled
          LUXURY_SERVICE_STATE_DIR: ${{ github.workspace }}/crawler/service
          RUN_MODE: ${{ inputs.mode || 'full' }}
          RUN_BRAND: ${{ inputs.brand || 'all' }}
        run: |
          set --
          if [ "$RUN_BRAND" != all ]; then set -- --brands "$RUN_BRAND"; fi
          if [ "$RUN_MODE" = reference-smoke ]; then
            node scripts/coordinated-crawler.mjs --reference-smoke "$@" > /dev/null 2>&1
          elif [ "$RUN_MODE" = smoke ]; then
            node scripts/coordinated-crawler.mjs --smoke "$@" > /dev/null 2>&1
          else
            node scripts/coordinated-crawler.mjs "$@" > /dev/null 2>&1
          fi
      - name: Preserve Dior denial receipts only
        if: always() && inputs.mode != 'parser-check' && inputs.mode != 'image-check'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: crawler/runtime/dior-weekly/failures
          key: ${{ runner.os }}-dior-denials-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Close owned browser processes
        if: always()
        run: node scripts/close-finished-crawl-browsers.mjs > /dev/null 2>&1
      - name: Prepare guarded diagnostic summary
        if: always()
        env:
          RUN_MODE: ${{ inputs.mode || 'full' }}
        run: node scripts/ci-crawler-report.mjs > /dev/null 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: guarded-summary
          path: .ci-report/summary*.json
          retention-days: 1
          if-no-files-found: ignore
  live-progress:
    if: inputs.mode != 'parser-check' && inputs.mode != 'image-check'
    permissions:
      contents: read
      actions: read
      checks: write
    uses: ./.github/workflows/catalog-progress.yml
    with:
      run_id: ${{ github.run_id }}
      brands: ${{ inputs.brand || 'all' }}
    secrets:
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
