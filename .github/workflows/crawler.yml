name: Luxmap crawler
run-name: ${{ inputs.mode || 'full' }} Luxmap crawler
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Run scope
        required: true
        default: smoke
        type: choice
        options: [smoke, full, image-check]
      brand:
        description: Optional diagnostic scope (daily schedule always includes all brands)
        required: true
        default: all
        type: choice
        options: [all, bottega-veneta]
permissions:
  contents: read
concurrency:
  group: luxmap-crawler
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: macos-14
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '25.8.0'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund > /dev/null 2>&1
      - name: Install required command line tools
        run: brew install ripgrep jq python@3.11 > /dev/null 2>&1
      - name: Provision pinned offline image processor
        run: |
          LUXURY_SETUP_PYTHON="$(brew --prefix python@3.11)/bin/python3.11" scripts/setup-image-runtime.sh > /dev/null 2>&1
          node scripts/test-image-pipeline.mjs
      - name: Check platform and token safeguards
        run: |
          scripts/token-safety-gate.sh > /dev/null
          node scripts/test-catalog-completeness.mjs
          node scripts/test-catalog-target-batches.mjs
          node scripts/test-prada-sitemap.mjs
          node scripts/test-crawler-schedule.mjs
          test -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network-outbound)' /usr/bin/true
          mkdir -p app crawler/service
      - name: Collect and ingest through unified registry
        if: inputs.mode != 'image-check'
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://nxgnbrdxxmlhtcnymqsl.supabase.co
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LUXURY_BROWSER_MAINTENANCE_SINK: '1'
          LUXURY_SERVICE_GUARD: enabled
          LUXURY_SERVICE_STATE_DIR: ${{ github.workspace }}/crawler/service
          RUN_MODE: ${{ inputs.mode || 'full' }}
          RUN_BRAND: ${{ inputs.brand || 'all' }}
        run: |
          set --
          if [ "$RUN_BRAND" != all ]; then set -- --brands "$RUN_BRAND"; fi
          if [ "$RUN_MODE" = smoke ]; then
            node scripts/coordinated-crawler.mjs --smoke "$@" > /dev/null 2>&1
          else
            node scripts/coordinated-crawler.mjs "$@" > /dev/null 2>&1
          fi
      - name: Close owned browser processes
        if: always()
        run: node scripts/close-finished-crawl-browsers.mjs > /dev/null 2>&1
      - name: Prepare guarded diagnostic summary
        if: always()
        run: node scripts/ci-crawler-report.mjs > /dev/null 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: guarded-summary
          path: .ci-report/summary.json
          retention-days: 1
          if-no-files-found: ignore
